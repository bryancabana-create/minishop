name: MiniShop CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build y pruebas
    runs-on: ubuntu-latest
    steps:
      - name: 1 - Descargar el código
        uses: actions/checkout@v4

      - name: 2 - Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 3 - Compilar
        run: mvn -B compile

      - name: 4 - Pruebas unitarias
        run: mvn -B test

      - name: 5 - Pruebas de integración y empaquetado
        run: mvn -B verify -DskipUTs=true

      - name: 6 - Guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/failsafe-reports/

      - name: 7 - Guardar el JAR
        uses: actions/upload-artifact@v4
        with:
          name: minishop-jar
          path: target/*.jar

  release:
    name: Publicar versión
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el JAR generado
        uses: actions/download-artifact@v4
        with:
          name: minishop-jar
          path: dist

      - name: Crear la Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.jar --verify-tag --title "MiniShop $GITHUB_REF_NAME" --generate-notes